<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>RefLink</title>
  <link rel="stylesheet" href="dialog.css?v=0.4.0">
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <script defer src="dialog.js?v=0.4.0"></script>
</head>
<body>
  <main>
    <div id="badge" class="badge" aria-hidden="true">R</div>
    <h1 id="title">RefLink</h1>
    <pre id="message"></pre>
    <div class="buttons">
      <button id="copy" class="secondary" hidden>复制内容</button>
      <button id="cancel" class="secondary" hidden>取消</button>
      <button id="confirm" class="danger" hidden>确认清理</button>
      <button id="close" class="primary">确定</button>
    </div>
  </main>
</body>
</html>
