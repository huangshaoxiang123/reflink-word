<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>RefLink</title>
  <link rel="stylesheet" href="dialog.css?v=0.6.0">
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <script defer src="dialog.js?v=0.6.0"></script>
</head>
<body>
  <main>
    <div id="badge" class="badge" aria-hidden="true">R</div>
    <h1 id="title">RefLink</h1>
    <pre id="message"></pre>
    <section id="activatePanel" class="activate-panel" hidden>
      <div class="device-box">
        <div class="device-label">本机机器码（一机一码）</div>
        <div class="device-row">
          <code id="deviceCode"></code>
          <button id="copyDevice" type="button" class="secondary small">复制机器码</button>
        </div>
      </div>
      <p id="activateHint" class="activate-hint"></p>
      <textarea id="activationInput" class="activate-input" rows="3" placeholder="在此粘贴永久激活码（以 RLK1- 开头）" autocomplete="off" spellcheck="false"></textarea>
      <div id="activateError" class="activate-error" hidden></div>
    </section>
    <div class="buttons">
      <button id="copy" class="secondary" hidden>复制内容</button>
      <button id="cancel" class="secondary" hidden>取消</button>
      <button id="confirm" class="danger" hidden>确认清理</button>
      <button id="activateSubmit" class="primary" hidden>立即激活</button>
      <button id="close" class="primary">确定</button>
    </div>
  </main>
</body>
</html>
